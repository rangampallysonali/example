name: CI
on:
  push:
jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20,22,24]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: setup java
        uses: actions/setup-node@v5
        with:
          node-version: "18"
          node-version: ${{ matrix.node-version }}
      
      - name: install dependencies
        run: npm install

      - name: run tests
        run: npm test